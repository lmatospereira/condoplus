name: Deploy

# Só roda depois que o CI passou na main (workflow_run), como no financial-ledger.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lmatospereira/zelora
  PUBLIC_URL: https://zelora.163-176-209-227.sslip.io

# Enfileira (não cancela): um `docker compose up -d` não deve ser interrompido.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
      actions: write # cache do GHA (cache-to: type=gha)
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - id: meta
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - name: Tags
        id: tags
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          version=$(tr -d '[:space:]' < VERSION)
          {
            echo "list<<EOF"
            echo "${image}:latest"
            echo "${image}:${{ steps.meta.outputs.sha }}"
            echo "${image}:v${version}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64 # VPS OCI Ampere (aarch64); runner amd64 compila via QEMU
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod,ignore-error=true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -eu
            sha="${{ needs.build-and-push.outputs.sha }}"
            cd ~/zelora
            # O compose de produção é versionado no repo; baixa o da versão sendo publicada.
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${sha}/docker-compose.prod.yml" -o docker-compose.yml
            export IMAGE_TAG="$sha"
            docker compose pull app
            docker compose up -d
            # Espera o healthcheck do container (migrations + start).
            for i in $(seq 1 60); do
              status=$(docker inspect --format '{{.State.Health.Status}}' zelora-app-1 2>/dev/null || echo starting)
              [ "$status" = healthy ] && break
              sleep 5
            done
            docker compose ps
            [ "$status" = healthy ] || { docker compose logs --tail 80 app; exit 1; }
            docker image prune -f

      - name: Smoke test (HTTPS público)
        run: |
          for i in $(seq 1 12); do
            curl -sf "${{ env.PUBLIC_URL }}/api/health" && exit 0
            sleep 5
          done
          exit 1
