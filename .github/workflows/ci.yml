name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Push numa branch com PR aberto dispara push + pull_request para o mesmo commit;
# sem isso, os dois rodariam em paralelo e cada um acionaria o deploy. A branch
# entra na chave para que main e develop no mesmo commit não se cancelem.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zelora
          POSTGRES_PASSWORD: zelora
          POSTGRES_DB: zelora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zelora"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://zelora:zelora@localhost:5432/zelora
      TEST_DATABASE_URL: postgresql://zelora:zelora@localhost:5432/zelora_test
      BETTER_AUTH_SECRET: ci-secret-not-used-in-production-0000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Create test database
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE zelora_test'

      - name: Tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build
